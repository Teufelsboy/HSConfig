  - name: Modern Hearthstone Mechanics Coverage Audit
    category: Hearthstone Semantics
    description: >
      Audit current and recent Hearthstone mechanics relevant to Wild decks, including
      Rewind, Herald, Shatter, Kindred, Tourist, Starship, Spellburst, Miniaturize,
