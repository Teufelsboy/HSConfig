  - name: Universal Any-Deck No-Block Proof And Failure Mode Audit
    category: Proof Strategy
    description: >
      Define the safest product meaning of "nothing is blocked; any valid deck should
      work" for HSConfig. Separate technical invalidity from warning-only mechanics,
      source-depth gaps, unsupported future mechanics, missing guide strength, combo
      uncertainty, and runtime-evidence-only tuning. Recommend the smallest next step
      that improves autonomy without making the skill over-conservative or bloated.
