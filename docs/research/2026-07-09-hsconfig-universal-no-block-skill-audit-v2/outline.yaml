      rush, charge, silence, transform, destroy, summon, draw, heal, overkill,
      and divine shield.
  - name: Representative Wild Deck Matrix Adequacy
    category: Deck stress matrix
    description: >
      Evaluate whether the current twelve-deck proof set is broad enough to
      catch common HSConfig failure modes across aggro, combo, weapon, discard,
      treant/token, hero-power, mech, boar/combo, pirate, big-minion, and
      low-curve Warrior shells, and identify the next non-bloating additions if
      any.
  - name: Lean Skill Architecture And Operator UX
    category: Repository architecture
    description: >
      Audit whether the HSConfig skill remains small, autonomous, competent,
      and pre-run only. Verify that warnings remain visible without becoming
      blockers, the operator path is simple, and HSTuner-only concerns such as
