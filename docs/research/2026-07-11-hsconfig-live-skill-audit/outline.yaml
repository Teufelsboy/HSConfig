items:
  - name: Skill Slimness And Operator UX
    category: Local Repo
    description: >
      Audit the installed HSConfig skill, source skill, README, and operator
      guide for slimness, autonomy, clarity, and bloat. Verify that normal users
      can start with one command and one report without reading historical plans.
  - name: Runtime Surface And VisionAI Correctness
    category: HearthRanger VisionAI
    description: >
      Audit all documented or known HearthRanger VisionAI CustomConfig surfaces,
      while distinguishing HSConfig's approved normal output surface:
      GlobalValues.json, Mulligan.json, per-card <CARDID>.json, and supported
      Combo.json. Presume.json and Concede.json are documented/non-normal or
      legacy/non-normal surfaces and must not be described as normal outputs.
  - name: No Block Apply Gate And Tests
    category: Local Repo
    description: >
      Audit the no-block contract, apply gate, operator summary, property tests,
      full test suite, and technical hard-block behavior. Verify that valid
      decks with warnings can proceed and invalid packages still block.
  - name: Hearthstone Semantic Coverage
    category: Hearthstone Semantics
    description: >
      Audit whether the pre-run system covers the right level of Hearthstone
      semantics for direct config generation: Mulligan anchors, GlobalValues,
      CardID behavior, Combo, Hero Power transforms, target/options, generated
      entities, weapons, secrets, locations, Dredge, Tradeable, Kindred,
      Tourist, Starship, Imbue, Rewind, Herald, Shatter, and unknown mechanics.
  - name: Real Deck Readiness And Next Action
    category: Product Boundary
    description: >
      Audit whether the best next step is more implementation or real-deck usage
      with targeted defect capture. Consider representative deck evidence,
      installed skill sync, docs current-truth, and whether another broad wave
      would add bloat.
