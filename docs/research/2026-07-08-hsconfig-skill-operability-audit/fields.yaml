field_categories:
  - category: audit
    fields:
      - name: audit_question
        required: true
        description: The precise question this audit item answers.
      - name: primary_sources
        required: true
        description: Source URLs, official docs, local repo files, or tests used as evidence.
      - name: confirmed_facts
        required: true
        description: Source-backed facts relevant to HSConfig skill quality and workflow.
      - name: current_repo_alignment
        required: true
        description: Whether the current repo is aligned, partially aligned, or not aligned.
      - name: strengths
        required: true
        description: What the current implementation does well.
      - name: gaps_or_risks
        required: true
        description: Remaining risks, simplification opportunities, or missing capabilities.
      - name: eleven_deck_implications
        required: true
        description: Implications for the provided eleven-deck audit matrix.
      - name: recommendation
        required: true
        description: The practical next recommendation for HSConfig.
      - name: confidence
        required: true
        description: "Confidence level for the audit item: high, medium, or low."
      - name: uncertain
        required: true
        description: Field names where source-backed certainty is not available.
