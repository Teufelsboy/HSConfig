field_categories:
  - category: audit
    fields:
      - name: audit_question
        required: true
        description: The exact question this audit item answers.
      - name: primary_sources
        required: true
        description: Official URLs, local files, tests, and command outputs used as evidence.
      - name: confirmed_facts
        required: true
        description: Source-backed facts about current HSConfig behavior.
      - name: current_repo_alignment
        required: true
        description: aligned, partially_aligned, or not_aligned with the lean HSConfig target.
      - name: strengths
        required: true
        description: What is working well now.
      - name: gaps_or_risks
        required: true
        description: Remaining risks, missing coverage, or simplification opportunities.
      - name: eleven_deck_implications
        required: true
        description: What the finding means for the eleven provided representative decks.
      - name: recommendation
        required: true
        description: Practical next recommendation.
      - name: confidence
        required: true
        description: high, medium, or low.
      - name: uncertain
        required: true
        description: Field names where certainty is not available.
