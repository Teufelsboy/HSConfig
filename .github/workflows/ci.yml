          $gate = Join-Path $sourceRoot 'scripts/check_release_gate.py'
          $pipWheelUrl = 'https://files.pythonhosted.org/packages/5d/95/6b5cb3461ea5673ba0995989746db58eb18b91b54dbf331e72f569540946/pip-26.1.2-py3-none-any.whl'
          $expectedPipSha256 = '382ff9f685ee3bc25864f820aa50505825f10f5458ffff07e30a6d96e5715cab'
          $pipWheel = Join-Path $runtimeRoot 'pip-26.1.2-py3-none-any.whl'
          Invoke-WebRequest -Uri $pipWheelUrl -OutFile $pipWheel
          $actualPipSha256 = (Get-FileHash -LiteralPath $pipWheel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPipSha256 -ne $expectedPipSha256) { throw 'bootstrap_pip_hash_mismatch' }
          $env:PYTHONPATH = $pipWheel
          & $venvPython -m pip install --no-index --no-deps --force-reinstall $pipWheel
          Remove-Item Env:PYTHONPATH
          $actualPip = (& $venvPython -m pip --version)
          if ($actualPip -notmatch '^pip 26\.1\.2 ') { throw 'bootstrap_pip_version_mismatch' }
          $selectedLock = Join-Path $sourceRoot "pylock.$pythonMinor.toml"
          $canonicalLock = Join-Path $runtimeRoot 'pylock.toml'
          Copy-Item -LiteralPath $selectedLock -Destination $canonicalLock
          $wheelhouse = Join-Path $runtimeRoot 'dependency-wheels'
          New-Item -ItemType Directory -Path $wheelhouse | Out-Null
          & $venvPython -m pip download --require-virtualenv --no-deps --only-binary=:all: --dest $wheelhouse -r $canonicalLock
          & $venvPython $gate --repo . --outputs "$env:RUNNER_TEMP/ci-wheelhouse-audit" --tree-mode working-pre-cutover --locked-check ci-wheelhouse-audit --json
          $dependencyWheels = @(Get-ChildItem -LiteralPath $wheelhouse -File -Filter '*.whl' | Where-Object { $_.Name -notlike 'setuptools-*' -and $_.Name -notlike 'coverage-*' } | Sort-Object -Property Name).FullName
          & $venvPython -m pip install --require-virtualenv --no-index --no-deps $dependencyWheels
          $buildBackendRoot = Join-Path $runtimeRoot 'build-backend'
          $env:PYTHONPATH = $buildBackendRoot
          & $venvPython $gate --repo . --outputs "$env:RUNNER_TEMP/ci-source-revalidate" --tree-mode working-pre-cutover --locked-check ci-source-revalidate --json
          if ((git rev-parse HEAD).Trim() -ne $commitOid -or (git rev-parse 'HEAD^{tree}').Trim() -ne $treeOid -or @(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'checkout_identity_changed_after_dependency_install' }
          & $venvPython $gate --repo . --outputs "$env:RUNNER_TEMP/ci-source-revalidate" --tree-mode working-pre-cutover --locked-check ci-source-revalidate --json
          & $venvPython -m pip install --require-virtualenv --no-deps --no-build-isolation $sourceRoot
          (Split-Path -Parent $venvPython) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venvRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$buildBackendRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Audit the locked dependency closure
        run: python -m pip_audit
      - name: Run contract mutations
        run: python scripts/run_contract_mutations.py --json
      - name: Reconcile the canonical output inventory
        run: python scripts/reconcile_outputs.py --outputs "${{ runner.temp }}/security-outputs" --apply --json
      - name: Scan publishable content through the canonical release bootstrap
        run: python scripts/check_release_gate.py --repo . --outputs "${{ runner.temp }}/security-outputs" --tree-mode working-pre-cutover --internal-check publishable_path_scan --json
      - name: Check repository hygiene through the canonical release bootstrap
        run: python scripts/check_release_gate.py --repo . --outputs "${{ runner.temp }}/security-outputs" --tree-mode working-pre-cutover --internal-check repository_hygiene --json
      - name: Verify checkout residue is zero
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
          $runnerItem = Get-Item -LiteralPath $runnerTemp -Force
          if ($runnerItem.LinkType -or (($runnerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or -not $runnerItem.PSIsContainer) {
            throw "unsafe_runner_temp_cleanup_root:$runnerTemp"
          }
          $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
          foreach ($name in @('hsconfig-ci-source-baseline', 'hsconfig-locked-runtime', 'hsconfig-skill', 'pip-cache', 'hypothesis', 'security-outputs')) {
            $candidate = Join-Path $runnerTemp $name
            if (Test-Path -LiteralPath $candidate) {
              $item = Get-Item -LiteralPath $candidate -Force
              if ($item.LinkType -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or -not $item.PSIsContainer) {
                throw "unsafe_runner_temp_cleanup_target:$candidate"
              }
              $expected = [IO.Path]::GetFullPath($candidate)
              $resolved = (Resolve-Path -LiteralPath $candidate).Path
              if (-not [String]::Equals($resolved, $expected, $comparison)) {
                throw "unsafe_runner_temp_cleanup_target:$resolved"
              }
              Remove-Item -LiteralPath $candidate -Recurse -Force
            }
          }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) { throw "checkout_dirty_after_job:$($dirty -join ',')" }
          $residue = @('build', 'dist', 'src/hsconfig.egg-info', '.coverage', 'coverage.json', '.pytest_cache', '.hypothesis') | Where-Object { Test-Path -LiteralPath $_ }
          if ($residue.Count -ne 0) { throw "checkout_residue_after_job:$($residue -join ',')" }
          $bytecode = @(Get-ChildItem -LiteralPath '.' -Recurse -Force -Directory | Where-Object { $_.Name -eq '__pycache__' })
          if ($bytecode.Count -ne 0) { throw "checkout_bytecode_after_job:$($bytecode.FullName -join ',')" }
          $packages = @(Get-ChildItem -LiteralPath '.' -Recurse -Force -File | Where-Object { $_.Name -match '\.(whl|tar\.gz)$' })
          if ($packages.Count -ne 0) { throw "checkout_package_artifact_after_job:$($packages.FullName -join ',')" }
