          python-version: ${{ matrix.python-version }}
      - name: Run canonical locked full tests and coverage
        run: python scripts/check_release_gate.py --repo . --outputs outputs --tree-mode working-pre-cutover --locked-check full-tests-and-coverage --json
      - name: Verify checkout residue is zero
        if: always()
        shell: pwsh
        run: |
