[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "hsconfig"
dynamic = ["version"]
description = "Guide-aligned HearthRanger VisionAI CustomConfig generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hearthstone>=9.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "hypothesis>=6.0",
  "ruff>=0.12",
  "pip-audit>=2.9",
  "pip==26.1.2",
  "build>=1.0",
]

[tool.setuptools.dynamic]
version = {attr = "hsconfig.version.__version__"}

[project.scripts]
hsconfig = "hsconfig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hsconfig = ["policies/*.json", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/hsconfig"]
patch = ["subprocess"]
data_file = "${COVERAGE_FILE?}"
omit = [
  "tests/*",
  "tests/**/*",
  "src/hsconfig/resources/*",
  "outputs/*",
]

[tool.coverage.report]
fail_under = 90

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
